<body>
<div id="phone">
  <div id="loader" aria-hidden="true"><img src="img/ui/ic-candle.png" alt="" class="flame" width="64" height="64"></div>
  <div id="scene" aria-hidden="true"></div>
  <header class="bar"><button id="back" class="mini" aria-label="Back"><svg viewBox="0 0 9 7" width="27" height="21" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><path d="M3 0h2v1H3zM2 1h3v1H2zM1 2h8v1H1zM0 3h9v1H0zM1 4h8v1H1zM2 5h3v1H2zM3 6h2v1H3z"/></svg></button><span id="bar-title"></span><button id="menu-btn" class="mini" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span class="burger"><i></i><i></i><i></i></span></button></header>
  <div id="menu-back" hidden></div>
  <aside id="menu" class="menu" hidden>
    <h3 data-ui="menuLang"></h3>
    <div class="langs" role="group"><button class="cta alt" data-lang="pl" aria-pressed="true">Polski</button><button class="cta alt" data-lang="en" aria-pressed="false">English</button></div>
    <h3 data-ui="menuSound"></h3>
    <button id="mute" class="cta alt"><img src="img/emoji/U+1F50A.png" alt=""><span></span></button>
    <div id="app-sec">
      <h3 data-ui="menuApp"></h3>
      <button id="install" class="cta alt" data-ui="install"></button>
      <p id="install-hint" hidden></p>
      <a class="cta alt" href="https://github.com/whosz/spoooky-deck#autorzy-i-licencje" target="_blank" rel="noopener" data-ui="licensesLink"></a>
    </div>
    <h3 data-ui="menuAuthor"></h3>
    <p data-ui="authorText"></p>
    <a id="sayhi" class="cta alt" href="https://www.whosz.pl" target="_blank" rel="noopener" data-ui="sayHi"></a>
  </aside>
  <main id="view">
    <section id="s-intro" class="screen intro">
      <div class="intro-top">
        <img class="emblem" src="img/ui/emblem.png" alt="" width="64" height="64">
        <h1 data-ui="title"></h1>
        <p class="tag" data-ui="tagline"></p>
      </div>
      <div class="intro-bottom">
        <p data-ui="heroText"></p>
        <button id="enter" class="cta" data-ui="enter"></button>
        <p id="music-hint" class="hint" data-ui="musicHint"></p>
      </div>
    </section>

    <section id="s-form" class="screen" hidden>
      <h2 class="ftitle" data-ui="formTitle"></h2>
      <p class="fintro" data-ui="formText"></p>
      <form id="form" class="panel">
        <label><span data-ui="name"></span><input id="f-name" maxlength="30" autocomplete="off" required pattern=".*\S.*"></label>
        <label><span data-ui="zodiac"></span><select id="f-zodiac"></select></label>
        <label><span data-ui="company"></span><input id="f-company" maxlength="60" required pattern=".*\S.*" autocomplete="off"></label>
        <label><span data-ui="industry"></span><select id="f-industry"></select></label>
        <label><span data-ui="stage"></span><select id="f-stage"></select></label>
        <button class="cta" data-ui="draw"></button>
        <button type="button" id="clear-form" class="linkbtn" data-ui="clearForm"></button>
      </form>
    </section>

    <section id="s-pick" class="screen" hidden>
      <div class="head">
        <p id="date"></p>
        <h1 data-ui="title"></h1>
      </div>
      <div class="mid">
        <p data-ui="pick"></p>
        <div class="divider"><i></i><b>◆</b><i></i></div>
      </div>
      <div id="fan" tabindex="0" role="listbox" aria-label="Deck"></div>
      <p class="hint" data-ui="drag"></p>
    </section>

    <section id="s-card" class="screen" hidden>
      <div id="cardslot"><div id="card" class="card"><div class="face back"></div><div class="face front"></div></div></div>
      <p id="quote" class="quote fade"></p>
      <div id="info" class="fade"></div>
      <button id="more" class="cta fade" data-ui="more"></button>
    </section>

    <section id="s-read" class="screen" hidden>
      <div id="artslot"></div>
      <h2 id="rname"></h2>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="fortune" data-ui="tabFortune"></button>
        <button role="tab" data-tab="card" data-ui="tabCard"></button>
        <button role="tab" data-tab="key" data-ui="tabKey"></button>
      </div>
      <div id="tabtext" class="text" aria-live="polite"></div>
      <div id="actions">
        <button id="again" class="cta alt" data-ui="again"></button>
        <button id="share" class="cta alt" data-ui="share"></button>
        <button id="share-img" class="cta alt" data-ui="shareImage"></button>
        <a id="offer" class="cta" target="_blank" rel="noopener" data-ui="offer"></a>
      </div>
    </section>
    <footer><span data-ui="disclaimer"></span></footer>
  </main>
</div>
<script src="js/vendor/seedrandom.min.js"></script>
<script src="js/vendor/tracery.js"></script>
<script src="js/vendor/zzfx.js"></script>
<script type="module" src="js/app.js?v=174"></script>
</body>
</html>
